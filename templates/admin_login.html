{% extends "base.html" %}

{% block title %}{{ site_name }} | 관리자 로그인{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-lg-5">
                    <h1 class="h4 fw-bold mb-1">관리자 로그인</h1>
                    <p class="text-secondary small mb-4">맛집을 등록·수정하려면 로그인하세요.</p>

                    <form method="post">
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">비밀번호</label>
                            <input type="password" class="form-control" id="password"
                                   name="password" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">로그인</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
